name: Temporary Neon Auth lockfile sync
on:
  push:
    branches: [feat/neon-auth-workspace]
    paths:
      - .github/workflows/refresh-neon-auth-lock.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor == 'thembaxx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: feat/neon-auth-workspace
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Dependency lockfile is already up to date.'
            exit 0
          fi
          git commit -m 'chore(lock): regenerate Neon Auth dependency lockfile'
          git push origin HEAD:feat/neon-auth-workspace
