name: Quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Public CI uses a non-functional auth origin and an explicitly test-only
    # signing secret. Production secrets are stored only in Vercel.
    env:
      NEON_AUTH_BASE_URL: https://auth.example.invalid
      NEON_AUTH_COOKIE_SECRET: ci-test-only-not-a-production-cookie-signing-secret-123456789
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: stokvelos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test
        env:
          POSTGRES_TEST_URL: postgresql://postgres:isolated-ci-only@localhost:5432/stokvelos_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          CI: true
