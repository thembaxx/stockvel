name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: stokvelos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
        env:
          POSTGRES_TEST_URL: postgresql://postgres:isolated-ci-only@localhost:5432/stokvelos_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
        env:
          CI: true
